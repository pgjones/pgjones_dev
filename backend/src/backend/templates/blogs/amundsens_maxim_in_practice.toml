"""
title = "Amundsen's Maxim in practice"

body = """
I was recently introduced to [Amundsen's
Maxim](https://www.amundsens-maxim.com/) as a follow on to Hynek's
excellent [Design Pressure
talk](https://hynek.me/talks/design-pressure/) and I think these
describe how I like to build APIs. Specifically I find it helpful if
the resource the APIs shares externally does not have to match the
model it uses internally. Amundsen's maxim describes this in a clearer
manner,

    Remember, when designing your Web API, your data model is not your
    object model is not your resource model is not your message model.

To show how I do this in practice I'm going to use
[Quart](https://github.com/pallets/quart),
[Quart-DB](https://github.com/pgjones/quart-db),
[SQL-tString](https://github.com/pgjones/sql-tstring), and
[Quart-Schema](https://github.com/pgjones/quart-schema) which are all
libraries I've authored with
[Pydantic](https://github.com/pydantic/pydantic).

## API Requirements

To demonstrate the maxim I'll build an API to store order
records. Each order will consist of a product that is either flower or
oil. Additionally, to demonstrate typical business logic, flowers will
have a grower email and each order of a flower recorded should be
accompanied with an email sent to the grower.

To do the above the API will need an interface to create an order and
another to return orders that have happened. To keep it as simple as
possible it will have a concept of products (name, size, grower) and
orders (product, paid_at).

To begin I can create the Quart app using Quart-DB and Quart-Schema,

```python
from quart import Quart
from quart_db import QuartDB
from quart_schema import QuartSchema

app = Quart(__name__)
db = QuartDB(app)
schema = QuartSchema(app)
```

For brevity I'll skip over the configuration of the app.

## Data model

The data model represents how the information is stored in the
database.

In this example two models are required, a products table and an order
table. Using a [Quart-DB
migration](https://quart-db.readthedocs.io/en/latest/how_to_guides/migrations.html)
I can define these via the following code,

```python
from quart_db import Connection


async def migrate(connection: Connection) -> None:
    await connection.execute(
        \"\"\"CREATE TABLE products(
            id INT PRIMARY KEY GENERATED ALWAYS AS IDENTITY,
            grower TEXT,
            name TEXT NOT NULL,
            quantity NUMERIC NOT NULL
        )\"\"\",
    )

    await connection.execute(
        \"\"\"CREATE TABLE orders (
            id INT PRIMARY KEY GENERATED ALWAYS AS IDENTITY,
            created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
            paid_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
            product_id INT NOT NULL REFERENCES products (id)
        )\"\"\",
   )
```

Note that I've defined the data models in SQL rather than via Python
classes e.g. as an ORM. This means that the data model is not the
object model.

## Object model

The object model defines how the information is structured in
application code.

In this simple example we need an object models to contain information
from the database, which I can implement as follows,

```python
from dataclasses import dataclass
from datetime import datetime

from pydantic import BaseModel
from sql_tstring import sql


@dataclass
class FlowerModel:
    id: int
    grower: str
    name: str
    quantity: Decimal


@dataclass
class OilModel:
    id: int
    name: str
    quantity: Decimal


async def select_product(
    connection: Connection, product_id: int
) -> FlowerModel | OilModel:
    query, values = sql(
        t\"\"\"SELECT id, grower, name, quantity
              FROM products
             WHERE id = {product_id}\"\"\",
    )
    result = await connection.fetch_one(query, values)
    if result["grower"] is not None:
        return FlowerModel(**result)
    else:
        return OilModel(
            id=result["id"], name=result["name"], quantity=result["quantity"]
        )


@dataclass
class OrderModel:
    id: int
    paid_at: datetime
    product_id: int


async def insert_order(
    connection: Connection, product_id: int
) -> OrderModel:
    query, values = sql(
        t\"\"\"INSERT INTO orders (product_id)
                 VALUES ({product_id})
              RETURNING id, paid_at, product_it\"\"\",
    )
    result = await connection.fetch_one(query, values)
    return OrderModel(**result)
```

### Relationship between data and object models

In practice I find the object model closely follows the data model,
yet they do not have to match exactly. I've demonstrated this in this
example via the created_at field which is only present in the data
model. This can often be the case for fields that are used in offline
analysis but not in the application code.

## Resource model

The resource model determines how clients interact with the API.

In this example we need a route to return order information, and
another to create an order. Both require resource definitions. I'll
implement these as follows,

```python
from quart import g
from quart_schema import validate_request, validate_response


class OrderResource(BaseModel):
    id: int
    paid_at: datetime
    product_id: int
    product_name: str
    product_quantity: Decimal
    product_unit: Unit


class OrdersResource(BaseModel):
    orders: list[OrderResource]


@app.get("/orders/")
@validate_response(OrdersResource)
async def get_orders() -> OrdersResource:
    query, values = sql(
        t\"\"\"SELECT o.id,
                   o.paid_at,
                   p.id AS product_id,
                   p.name AS product_name,
                   p.quantity AS product_quantity
              FROM orders o
              JOIN products p ON p.id = o.product_id\"\"\",
    )
    orders = [
        OrderResource(**row)
        async for order in connection.iterate(query, values)
    ]
    return OrdersResource(orders=orders)


class OrderDataResource(BaseModel):
    product_id: int


@app.post("/orders/")
@validate_request(OrderDataResource)
async def create_order(data: OrderDataResource) -> OrderModel:
    order = await insert_order(g.connection, data.product_id)
    product = await select_product(g.connection, data.product_id)
    if isinstance(product, FlowerModel):
        await _email_grower(product)
    return order


async def _email_grower(product: FlowerModel) -> None:
    body = f"{product.name} purchased"
    await send(product.grower, body)
```

### Relationship between object and resource models

The resource models allow the client to receive a much richer
description of the order than the object model alone
gives. Specifically I've included the product name and quantity whilst
excluding the grower email as that is for internal use only.

The object model, specifically the `FlowerModel` does provide the
grower email for the `_email_grower` usage and does so in a type safe
manner (no checks for `product.grower is not None` are required).

## Message model

Finally the message model dictates how data is exchanged over the network.

As I'm using Quart-Schema this will be JSON. Note though that the
`Decimal` and `datetime` types present in the resource models have no
native JSON equivalents Quart-Schema defines how they are serialised
and parsed using standard Pydantic methods.

# Conclusion

This article is in contrast to those that claim that using the same
model/class is an advantage. In my experience using the same
model/class constrains the API with the resulting design pressure
forcing awkward workarounds such as giant models full of optional
attributes.

"""
